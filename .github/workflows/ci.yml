name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The distance measures are pure numpy and scipy, but the tokenisation tests
      # need spaCy and the corpus loader needs scikit-learn, so both are installed
      # here. Only the blank spaCy pipeline is used, so no language model is
      # downloaded. Torch comes from the CPU index to keep the job short.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest spacy scikit-learn

      - name: Tests
        run: python -m pytest tests/ -q
